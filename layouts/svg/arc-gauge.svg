{# canvas: responsive #}
{# vars:
cpu_color: color = "#ff6b80" "CPU accent color"
gpu_color: color = "#7eb8ff" "GPU accent color"
fps_color: color = "#00f5c8" "FPS accent color"
text_color: color = "#ffffff" "Primary text color"
dim_color: color = "#9999aa" "Dim label color"
cpu_label: text = "CPU" "CPU gauge label"
gpu_label: text = "GPU" "GPU gauge label"
fps_label: text = "FPS" "Frame rate label"
ram_label: text = "RAM" "Memory label"
vram_label: text = "VRAM" "Video memory label"
#}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {{ width }} {{ height }}" width="{{ width }}" height="{{ height }}">
  {% set use_compact_typography = width <= 320 or height <= 320 %}
  <defs>
    <linearGradient id="cpuArc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="{{ cpu_color }}"/>
      <stop offset="100%" stop-color="#ff8a5c"/>
    </linearGradient>
    <linearGradient id="gpuArc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="{{ gpu_color }}"/>
      <stop offset="100%" stop-color="#9b59ff"/>
    </linearGradient>
    <linearGradient id="fpsGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="{{ fps_color }}"/>
      <stop offset="100%" stop-color="#00c896"/>
    </linearGradient>
    <!-- Glow filters -->
    <filter id="cpuGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="gpuGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  {% if is_portrait %}
  <g transform="translate(0, {{ (height - width) / 2 }}) scale({{ width * 1.0 / 480 }})">
  {% elif is_square %}
  <g transform="scale({{ width * 1.0 / 480 }})">
  {% else %}
  <g transform="translate({{ (width - height) / 2 }}, 0) scale({{ height * 1.0 / 480 }})">
  {% endif %}

  <!-- === CPU Gauge (left) === -->
  <g transform="translate(140, 160)">
    <!-- Track -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#1a1a2e" stroke-width="14"
            stroke-dasharray="471 157" stroke-dashoffset="-78" stroke-linecap="round"/>
    <!-- Arc fill — 270° sweep, driven by cpu_util -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#cpuArc)" stroke-width="14"
            stroke-dasharray="{{ cpu_util | default(value='0') | float * 4.71 | round(precision=0) }} 628"
            stroke-dashoffset="-78" stroke-linecap="round" filter="url(#cpuGlow)"/>
    <!-- Labels -->
    <text x="0" y="-18" font-family="DejaVu Sans Mono, monospace" font-size="42" fill="{{ text_color }}"
          text-anchor="middle" font-weight="bold">{{ cpu_temp | default(value="--") }}°</text>
    <text x="0" y="14" font-family="DejaVu Sans Mono, monospace" font-size="{% if use_compact_typography %}20{% else %}18{% endif %}" fill="{{ cpu_color }}"
          text-anchor="middle">{{ cpu_util | default(value="--") }}%</text>
    <text x="0" y="40" font-family="DejaVu Sans Mono, monospace" font-size="{% if use_compact_typography %}20{% else %}12{% endif %}" fill="{{ dim_color }}"
          text-anchor="middle">{{ cpu_label }}</text>
  </g>

  <!-- === GPU Gauge (right) === -->
  <g transform="translate(340, 160)">
    <!-- Track -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#1a1a2e" stroke-width="14"
            stroke-dasharray="471 157" stroke-dashoffset="-78" stroke-linecap="round"/>
    <!-- Arc fill -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#gpuArc)" stroke-width="14"
            stroke-dasharray="{{ gpu_util | default(value='0') | float * 4.71 | round(precision=0) }} 628"
            stroke-dashoffset="-78" stroke-linecap="round" filter="url(#gpuGlow)"/>
    <!-- Labels -->
    <text x="0" y="-18" font-family="DejaVu Sans Mono, monospace" font-size="42" fill="{{ text_color }}"
          text-anchor="middle" font-weight="bold">{{ gpu_temp | default(value="--") }}°</text>
    <text x="0" y="14" font-family="DejaVu Sans Mono, monospace" font-size="{% if use_compact_typography %}20{% else %}18{% endif %}" fill="{{ gpu_color }}"
          text-anchor="middle">{{ gpu_util | default(value="--") }}%</text>
    <text x="0" y="40" font-family="DejaVu Sans Mono, monospace" font-size="{% if use_compact_typography %}20{% else %}12{% endif %}" fill="{{ dim_color }}"
          text-anchor="middle">{{ gpu_label }}</text>
  </g>

  <!-- === GPU Power (center bottom) === -->
  <text x="240" y="300" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#b08aff"
        text-anchor="middle">{{ gpu_power | default(value="--") }}W</text>

  <!-- === Bottom Stats Bar === -->
  <rect x="24" y="340" width="432" height="2" rx="1" fill="#1a1a2e"/>

  <!-- FPS -->
  <text x="240" y="395" font-family="DejaVu Sans Mono, monospace" font-size="56" fill="url(#fpsGrad)"
        text-anchor="middle" font-weight="bold">{{ fps | default(value="--") }}</text>
  <text x="240" y="420" font-family="DejaVu Sans Mono, monospace" font-size="{% if use_compact_typography %}20{% else %}13{% endif %}" fill="{{ dim_color }}"
        text-anchor="middle">{{ fps_label }}</text>
  <text x="240" y="442" font-family="DejaVu Sans Mono, monospace" font-size="{% if use_compact_typography %}20{% else %}14{% endif %}" fill="#88aa99"
        text-anchor="middle">{{ frametime | default(value="--") }}ms</text>

  <!-- RAM -->
  <text x="72" y="390" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#cc9eff"
        text-anchor="middle" font-weight="bold">{{ ram_used | default(value="--") }}G</text>
  <text x="72" y="412" font-family="DejaVu Sans Mono, monospace" font-size="{% if use_compact_typography %}20{% else %}10{% endif %}" fill="{{ dim_color }}"
        text-anchor="middle">{{ ram_label }}</text>

  <!-- VRAM -->
  <text x="408" y="390" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#cc9eff"
        text-anchor="middle" font-weight="bold">{{ vram_used | default(value="--") }}G</text>
  <text x="408" y="412" font-family="DejaVu Sans Mono, monospace" font-size="{% if use_compact_typography %}20{% else %}10{% endif %}" fill="{{ dim_color }}"
        text-anchor="middle">{{ vram_label }}</text>
  </g>
  {% if is_portrait and height - width > 40 %}
  <text x="{{ width / 2 }}" y="{{ token_margin + token_label }}" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="{{ token_label }}" fill="#888888">ARC GAUGE</text>
  {% elif width - height > 300 %}
  <text x="{{ (width - height) / 4 }}" y="{{ height / 2 }}" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="{{ token_hero }}" fill="{{ cpu_color }}">{{ cpu_temp | default(value="--") }}°</text>
  <text x="{{ width - (width - height) / 4 }}" y="{{ height / 2 }}" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="{{ token_hero }}" fill="{{ gpu_color }}">{{ gpu_temp | default(value="--") }}°</text>
  {% endif %}
</svg>
