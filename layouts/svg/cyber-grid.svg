{# canvas: responsive #}
{# vars:
cpu_color: color = "#ff5577" "CPU accent color"
gpu_color: color = "#55aaff" "GPU accent color"
fps_color: color = "#00ffaa" "FPS accent color"
dim_color: color = "#9999aa" "Dim label color"
cpu_label: text = "CPU" "CPU section label"
gpu_label: text = "GPU" "GPU section label"
temp_label: text = "TEMP" "Temperature label"
ram_label: text = "RAM" "Memory label"
vram_label: text = "VRAM" "Video memory label"
#}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {{ width }} {{ height }}" width="{{ width }}" height="{{ height }}">
  <defs>
    <linearGradient id="hotGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="{{ cpu_color }}"/>
      <stop offset="100%" stop-color="#ff6633"/>
    </linearGradient>
    <linearGradient id="coldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="{{ gpu_color }}"/>
      <stop offset="100%" stop-color="#6633ff"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="{{ fps_color }}"/>
      <stop offset="100%" stop-color="#00cc88"/>
    </linearGradient>
    <linearGradient id="barBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#161628"/>
      <stop offset="100%" stop-color="#1a1a30"/>
    </linearGradient>
    <clipPath id="cpuBar">
      <rect x="32" y="140" width="{{ cpu_util | default(value='0') | float * 4.16 | round(precision=0) }}" height="18" rx="4"/>
    </clipPath>
    <clipPath id="gpuBar">
      <rect x="32" y="310" width="{{ gpu_util | default(value='0') | float * 4.16 | round(precision=0) }}" height="18" rx="4"/>
    </clipPath>
    <!-- Subtle scan-line pattern -->
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="480" height="4">
      <rect width="480" height="2" fill="transparent"/>
      <rect y="2" width="480" height="2" fill="#000000" opacity="0.08"/>
    </pattern>
  </defs>
  {% if is_portrait %}
  <g transform="translate(0, {{ (height - width) / 2 }}) scale({{ width * 1.0 / 480 }})">
  {% elif is_square %}
  <g transform="scale({{ width * 1.0 / 480 }})">
  {% else %}
  <g transform="translate({{ (width - height) / 2 }}, 0) scale({{ height * 1.0 / 480 }})">
  {% endif %}

  <!-- Scanline overlay (intentional cosmetic, composites over any background) -->
  <rect width="480" height="480" fill="url(#scanlines)"/>

  <!-- Decorative grid lines -->
  <line x1="240" y1="0" x2="240" y2="480" stroke="#111122" stroke-width="1"/>
  <line x1="0" y1="170" x2="480" y2="170" stroke="#111122" stroke-width="1"/>
  <line x1="0" y1="340" x2="480" y2="340" stroke="#111122" stroke-width="1"/>

  <!-- ===== CPU Section ===== -->
  <text x="32" y="40" font-family="DejaVu Sans Mono, monospace" font-size="{% if width <= 320 %}20{% else %}12{% endif %}" fill="{{ cpu_color }}" letter-spacing="4">{{ cpu_label }}</text>
  <line x1="32" y1="50" x2="200" y2="50" stroke="#ff336644" stroke-width="1"/>

  <!-- CPU Temp — large hero number -->
  <text x="32" y="116" font-family="DejaVu Sans Mono, monospace" font-size="72" fill="url(#hotGrad)" font-weight="bold">{{ cpu_temp | default(value="--") }}°</text>
  <text x="320" y="100" font-family="DejaVu Sans Mono, monospace" font-size="{% if width <= 320 %}20{% else %}14{% endif %}" fill="{{ dim_color }}" text-anchor="end">{{ temp_label }}</text>

  <!-- CPU Utilization bar -->
  <rect x="32" y="140" width="416" height="18" rx="4" fill="url(#barBg)"/>
  <rect x="32" y="140" width="416" height="18" rx="4" fill="url(#hotGrad)" clip-path="url(#cpuBar)" opacity="0.8"/>
  <text x="448" y="155" font-family="DejaVu Sans Mono, monospace" font-size="{% if width <= 320 %}20{% else %}14{% endif %}" fill="#ff8899" text-anchor="end">{{ cpu_util | default(value="--") }}%</text>

  <!-- ===== GPU Section ===== -->
  <text x="32" y="210" font-family="DejaVu Sans Mono, monospace" font-size="{% if width <= 320 %}20{% else %}12{% endif %}" fill="{{ gpu_color }}" letter-spacing="4">{{ gpu_label }}</text>
  <line x1="32" y1="220" x2="200" y2="220" stroke="#3366ff44" stroke-width="1"/>

  <!-- GPU Temp — large hero number -->
  <text x="32" y="286" font-family="DejaVu Sans Mono, monospace" font-size="72" fill="url(#coldGrad)" font-weight="bold">{{ gpu_temp | default(value="--") }}°</text>
  <text x="320" y="270" font-family="DejaVu Sans Mono, monospace" font-size="{% if width <= 320 %}20{% else %}14{% endif %}" fill="{{ dim_color }}" text-anchor="end">{{ temp_label }}</text>
  <text x="448" y="270" font-family="DejaVu Sans Mono, monospace" font-size="{% if width <= 320 %}20{% else %}18{% endif %}" fill="#9966cc" text-anchor="end">{{ gpu_power | default(value="--") }}W</text>

  <!-- GPU Utilization bar -->
  <rect x="32" y="310" width="416" height="18" rx="4" fill="url(#barBg)"/>
  <rect x="32" y="310" width="416" height="18" rx="4" fill="url(#coldGrad)" clip-path="url(#gpuBar)" opacity="0.8"/>
  <text x="448" y="325" font-family="DejaVu Sans Mono, monospace" font-size="{% if width <= 320 %}20{% else %}14{% endif %}" fill="#77bbff" text-anchor="end">{{ gpu_util | default(value="--") }}%</text>

  <!-- ===== Bottom Stats ===== -->
  <!-- FPS — center hero -->
  <text x="240" y="415" font-family="DejaVu Sans Mono, monospace" font-size="52" fill="url(#greenGrad)"
        text-anchor="middle" font-weight="bold">{{ fps | default(value="--") }}</text>
  <text x="240" y="438" font-family="DejaVu Sans Mono, monospace" font-size="{% if width <= 320 %}20{% else %}11{% endif %}" fill="#88aa99"
        text-anchor="middle">{{ frametime | default(value="--") }}ms</text>

  <!-- RAM — left -->
  <text x="{% if width <= 320 %}88{% else %}56{% endif %}" y="{% if width <= 320 %}392{% else %}400{% endif %}" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#cc99ff"
        text-anchor="middle">{{ ram_used | default(value="--") }}G</text>
  <text x="{% if width <= 320 %}88{% else %}56{% endif %}" y="{% if width <= 320 %}428{% else %}418{% endif %}" font-family="DejaVu Sans Mono, monospace" font-size="{% if width <= 320 %}20{% else %}9{% endif %}" fill="{{ dim_color }}"
        text-anchor="middle">{{ ram_label }} / {{ ram_total | default(value="--") }}G</text>

  <!-- VRAM — right -->
  <text x="{% if width <= 320 %}392{% else %}424{% endif %}" y="{% if width <= 320 %}392{% else %}400{% endif %}" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#cc99ff"
        text-anchor="middle">{{ vram_used | default(value="--") }}G</text>
  <text x="{% if width <= 320 %}392{% else %}424{% endif %}" y="{% if width <= 320 %}428{% else %}418{% endif %}" font-family="DejaVu Sans Mono, monospace" font-size="{% if width <= 320 %}20{% else %}9{% endif %}" fill="{{ dim_color }}"
        text-anchor="middle">{{ vram_label }} / {{ vram_total | default(value="--") }}G</text>

  <!-- Corner accents -->
  <path d="M 0 20 L 0 0 L 20 0" stroke="#ff336644" fill="none" stroke-width="2"/>
  <path d="M 460 0 L 480 0 L 480 20" stroke="#3366ff44" fill="none" stroke-width="2"/>
  <path d="M 0 460 L 0 480 L 20 480" stroke="#ff336644" fill="none" stroke-width="2"/>
  <path d="M 460 480 L 480 480 L 480 460" stroke="#3366ff44" fill="none" stroke-width="2"/>
  </g>
  {% if is_portrait and height - width > 40 %}
  <text x="{{ width / 2 }}" y="{{ token_margin + token_label }}" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="{{ token_label }}" fill="{{ fps_color }}">CYBER GRID</text>
  {% elif width - height > 300 %}
  <path d="M 0 {{ height / 2 }} H {{ (width - height) / 2 }}" stroke="{{ cpu_color }}" stroke-width="2" opacity="0.5"/>
  <path d="M {{ width - (width - height) / 2 }} {{ height / 2 }} H {{ width }}" stroke="{{ gpu_color }}" stroke-width="2" opacity="0.5"/>
  <text x="{{ (width - height) / 4 }}" y="{{ height / 2 - token_gap }}" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="{{ token_medium }}" fill="{{ cpu_color }}">{{ cpu_util | default(value="--") }}%</text>
  <text x="{{ width - (width - height) / 4 }}" y="{{ height / 2 - token_gap }}" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="{{ token_medium }}" fill="{{ gpu_color }}">{{ gpu_util | default(value="--") }}%</text>
  {% endif %}
</svg>
