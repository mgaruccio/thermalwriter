{# vars:
theme_primary: color = "#e94560" "CPU accent color"
theme_secondary: color = "#53d8fb" "GPU accent color"
theme_accent: color = "#20f5d8" "FPS accent color"
theme_background: color = "#08080f" "Background color"
cpu_label: text = "CPU" "CPU panel label"
gpu_label: text = "GPU" "GPU panel label"
ram_label: text = "RAM" "Memory label"
vram_label: text = "VRAM" "Video memory label"
fps_label: text = "FPS" "Frame rate label"
#}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <defs>
    <linearGradient id="cpuGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="{{ theme_primary }}"/>
      <stop offset="100%" stop-color="#a8203a"/>
    </linearGradient>
    <linearGradient id="gpuGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="{{ theme_secondary }}"/>
      <stop offset="100%" stop-color="#2a8ab0"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151520"/>
      <stop offset="100%" stop-color="#0e0e18"/>
    </linearGradient>
  </defs>

  <!-- CPU Panel -->
  <rect x="16" y="16" width="448" height="172" rx="8" fill="url(#panelGrad)"/>
  <rect x="16" y="16" width="4" height="172" rx="2" fill="{{ theme_primary }}"/>
  <text x="36" y="46" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#888888">{{ cpu_label }}</text>
  <text x="36" y="120" font-family="DejaVu Sans Mono, monospace" font-size="64" fill="url(#cpuGrad)" font-weight="bold">{{ cpu_temp | default(value="--") }}°C</text>
  <text x="36" y="168" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#c4546e">{{ cpu_util | default(value="--") }}% LOAD</text>
  <!-- CPU power - right side -->
  <text x="444" y="110" font-family="DejaVu Sans Mono, monospace" font-size="52" fill="#c4546e" text-anchor="end" opacity="0.7">{{ cpu_power | default(value="--") }}W</text>

  <!-- GPU Panel -->
  <rect x="16" y="200" width="448" height="172" rx="8" fill="url(#panelGrad)"/>
  <rect x="16" y="200" width="4" height="172" rx="2" fill="{{ theme_secondary }}"/>
  <text x="36" y="230" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#888888">{{ gpu_label }}</text>
  <text x="36" y="304" font-family="DejaVu Sans Mono, monospace" font-size="64" fill="url(#gpuGrad)" font-weight="bold">{{ gpu_temp | default(value="--") }}°C</text>
  <text x="36" y="352" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#5aabb8">{{ gpu_util | default(value="--") }}% LOAD</text>
  <!-- GPU power - right side -->
  <text x="444" y="294" font-family="DejaVu Sans Mono, monospace" font-size="52" fill="#5aabb8" text-anchor="end" opacity="0.7">{{ gpu_power | default(value="--") }}W</text>

  <!-- Bottom Stats Row -->
  <rect x="16" y="384" width="140" height="80" rx="6" fill="url(#panelGrad)"/>
  <text x="86" y="420" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#cc9eff" text-anchor="middle">{{ ram_used | default(value="--") }}G</text>
  <text x="86" y="452" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#999999" text-anchor="middle">{{ ram_label }}</text>

  <rect x="170" y="384" width="140" height="80" rx="6" fill="url(#panelGrad)"/>
  <text x="240" y="420" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#cc9eff" text-anchor="middle">{{ vram_used | default(value="--") }}G</text>
  <text x="240" y="452" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#999999" text-anchor="middle">{{ vram_label }}</text>

  <rect x="324" y="384" width="140" height="80" rx="6" fill="url(#panelGrad)"/>
  <text x="394" y="420" font-family="DejaVu Sans Mono, monospace" font-size="26" fill="{{ theme_accent }}" text-anchor="middle">{{ fps | default(value="--") }}</text>
  <text x="394" y="452" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#999999" text-anchor="middle">{{ fps_label }}</text>
</svg>
