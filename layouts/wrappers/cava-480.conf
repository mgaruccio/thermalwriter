# cava-480.conf — thermalwriter LCD wrapper
# 480x480 cava visualiser for streaming to the Thermalright LCD via:
#   SDL_VIDEODRIVER=x11 cava -p ~/.config/thermalwriter/wrappers/cava-480.conf
#
# IMPORTANT: SDL_VIDEODRIVER=x11 MUST be set in the launch environment.
# The thermalwriter daemon inherits WAYLAND_DISPLAY; without SDL_VIDEODRIVER=x11
# cava's SDL backend will try Wayland and crash on a headless Xvfb display.
# thermalwriter ctl mirror sets this automatically when launching from the
# preset — do not rely on your shell environment alone.
#
# bars: hard limit — do NOT set bars >= 24 at 480px (cava aborts: "window too narrow").
# This config uses bars=20 with bar_width=20 + bar_spacing=4 → 20×24=480px exact fill.
# channels=mono: mixes L+R so all 20 bars render across the full width.
# Stereo splits the spectrum left/right, producing sparse edge-only bars.

[general]
framerate = 30
bars = 20
# mono: mix L+R into a single full-width spectrum (avoids stereo edge-bar problem)
channels = mono

[input]
method = pulse
source = auto

[output]
method = sdl
# 20 bars × (bar_width=20 + bar_spacing=4) = 480px — fills the full LCD width
bar_width = 20
bar_spacing = 4

[sdl]
width = 480
height = 480
# Fullscreen mode: ensures cava fills the entire 480×480 Xvfb window so
# thermalwriter captures the full frame.
fullscreen = 1

[color]
# Bright high-contrast Tokyo Night palette chosen for LCD legibility.
# Gradient runs from low-freq (#7aa2f7, blue) to high-freq (#f7768e, red-pink).
gradient = 1
gradient_count = 8
gradient_color_1 = '#7aa2f7'
gradient_color_2 = '#7dcfff'
gradient_color_3 = '#9ece6a'
gradient_color_4 = '#e0af68'
gradient_color_5 = '#ff9e64'
gradient_color_6 = '#f7768e'
gradient_color_7 = '#bb9af7'
gradient_color_8 = '#c0caf5'

# Background: Tokyo Night Storm (#1a1b26) — opaque, matches conky wrapper
background = '#1a1b26'

[smoothing]
# Gentle smoothing for a clean visualisation without lag
monstercat = 0
waves = 0
noise_reduction = 77
