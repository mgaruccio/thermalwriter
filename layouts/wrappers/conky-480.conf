-- conky-480.conf — thermalwriter LCD wrapper
-- 480x480 conky layout for streaming to the Thermalright LCD via:
--   thermalwriter ctl mirror "conky -c ~/.config/thermalwriter/wrappers/conky-480.conf"
--
-- Requirements:
--   background = false   → daemon can SIGTERM; child-liveness 150ms check won't false-kill
--   own_window = true    → required for Xvfb rendering without a live desktop
--   alignment top_left + gap 0,0 → fills the 480x480 Xvfb display exactly

conky.config = {
    -- Window / Xvfb integration
    background        = false,          -- foreground: daemon SIGTERMs this directly
    own_window        = true,
    own_window_type   = 'desktop',      -- composites cleanly under Xvfb
    own_window_hints  = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    -- Tokyo Night Storm background (#1a1b26) — opaque so LCD has solid bg
    own_window_colour = '#1a1b26',
    own_window_argb_visual = false,

    -- Geometry: fill the 480×480 Xvfb display
    minimum_width     = 480,
    minimum_height    = 480,
    maximum_width     = 480,
    alignment         = 'top_left',
    gap_x             = 0,
    gap_y             = 0,

    -- Rendering
    double_buffer     = true,           -- eliminate flicker
    no_buffers        = true,
    update_interval   = 1.0,
    cpu_avg_samples   = 2,
    net_avg_samples   = 2,

    -- Fonts: IBM Plex Mono at 16px — meets LCD legibility floor
    use_xft           = true,
    font              = 'IBM Plex Mono:size=16',

    -- Colours (all >= #999999 to survive LCD backlight washout)
    default_color     = '#c0caf5',      -- Tokyo Night text (foreground)
    default_shade_color = '#1a1b26',
    default_outline_color = '#1a1b26',

    -- Borders / extras off
    draw_shades       = false,
    draw_outline      = false,
    draw_borders      = false,
    draw_graph_borders = false,
}

-- ─── Layout ──────────────────────────────────────────────────────────────────
-- All colors explicitly specified (>= #999999) so backlight doesn't wash them.

conky.text = [[
${color #7aa2f7}${font IBM Plex Mono:bold:size=14}SYSTEM${font}${color}
${color #9ece6a}CPU${color}    ${color #c0caf5}${cpu cpu0}%${color}
${cpubar 8,480}
${color #9ece6a}TEMP${color}   ${color #c0caf5}${hwmon 0 temp 1}°C${color}
${color #9ece6a}RAM${color}    ${color #c0caf5}${mem} / ${memmax}${color}
${membar 8,480}

${color #7aa2f7}${font IBM Plex Mono:bold:size=14}PROCESSES${font}${color}
${color #bb9af7}${top name 1}${color}  ${color #e0af68}${top cpu 1}%${color}
${color #bb9af7}${top name 2}${color}  ${color #e0af68}${top cpu 2}%${color}
${color #bb9af7}${top name 3}${color}  ${color #e0af68}${top cpu 3}%${color}
${color #bb9af7}${top name 4}${color}  ${color #e0af68}${top cpu 4}%${color}
${color #bb9af7}${top name 5}${color}  ${color #e0af68}${top cpu 5}%${color}

${color #7aa2f7}${font IBM Plex Mono:bold:size=14}NETWORK${font}${color}
${color #9ece6a}UP${color}     ${color #c0caf5}${upspeedf eth0} KB/s${color}
${color #9ece6a}DOWN${color}   ${color #c0caf5}${downspeedf eth0} KB/s${color}

${color #7aa2f7}${font IBM Plex Mono:bold:size=14}DISK${font}${color}
${color #9ece6a}READ${color}   ${color #c0caf5}${diskio_read /dev/sda}${color}
${color #9ece6a}WRITE${color}  ${color #c0caf5}${diskio_write /dev/sda}${color}
${diskiograph /dev/sda 40,480 #7aa2f7 #e0af68 0 -l}

${color #7aa2f7}${font IBM Plex Mono:bold:size=14}UPTIME${font}${color}
${color #c0caf5}${uptime}${color}
]]
