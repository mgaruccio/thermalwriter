[package]
name = "thermalwriter-tray"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Lightweight system tray controller for the thermalwriter daemon"
license = "GPL-3.0-or-later"
repository = "https://github.com/mgaruccio/thermalwriter"
homepage = "https://github.com/mgaruccio/thermalwriter"
publish = false

[[bin]]
name = "thermalwriter-tray"
path = "src/main.rs"

[dependencies]
# Intentionally does NOT depend on the thermalwriter library crate: that would
# pull render/sensor deps into a tray that only needs a few D-Bus method calls.
# The proxy below mirrors src/dbus_types.rs — keep them in sync.
ksni = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "process"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
png = "0.17"
