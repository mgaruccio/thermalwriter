[package]
name = "thermalwriter-gui"
version = "0.1.0"
description = "Configuration GUI for the thermalwriter cooler LCD daemon"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/mgaruccio/thermalwriter"
publish = false

[[bin]]
name = "thermalwriter-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Enable the Tauri devtools inspector. Activated automatically by `cargo tauri dev`;
# NOT included in default features so `cargo tauri build` (release) omits it.
devtools = ["tauri/devtools"]

[dependencies]
thermalwriter = { path = "../..", default-features = false }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
# MCP bridge plugin so the GUI can be driven from Claude Code's Tauri MCP
# server during development. The `#[cfg(debug_assertions)]` block in
# src/lib.rs ensures `init()` is only called in dev builds, so release builds
# never start the WebSocket server even though the crate is linked.
tauri-plugin-mcp-bridge = "0.11"

[dev-dependencies]
tempfile = "3"
