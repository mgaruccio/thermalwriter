[package]
name = "thermalwriter-gui"
version = "0.1.4"
description = "Configuration GUI for the thermalwriter cooler LCD daemon"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/mgaruccio/thermalwriter"
publish = false

[[bin]]
name = "thermalwriter-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Dev-only: Tauri inspector + MCP bridge plugin/capability. Enabled by `npm run tauri:dev`.
# Release builds (`npm run tauri:build`) omit this feature entirely.
devtools = ["tauri/devtools", "dep:tauri-plugin-mcp-bridge"]

[dependencies]
thermalwriter = { path = "../..", default-features = false }
tiny-skia = "0.12"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
# Optional dev-only MCP bridge — see the `devtools` feature.
tauri-plugin-mcp-bridge = { version = "0.11", optional = true }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
