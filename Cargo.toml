[package]
name = "thermalwriter"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "Linux daemon for Thermalright cooler LCD displays"
license = "GPL-3.0-or-later"
repository = "https://github.com/mgaruccio/thermalwriter"
homepage = "https://github.com/mgaruccio/thermalwriter"
readme = "README.md"
keywords = ["thermalright", "lcd", "cooler", "daemon", "linux"]
categories = ["command-line-utilities", "hardware-support"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/THIRD_PARTY_NOTICES.md",
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/benches/**",
    "/assets/**",
    "/layouts/blitz-glass.html",
    "/layouts/blitz-rings.html",
    "/layouts/dual-gauge.html",
    "/layouts/fps-hero.html",
    "/layouts/gpu-focus.html",
    "/layouts/minimal.html",
    "/layouts/neon-dash.html",
    "/layouts/system-stats.html",
    "/layouts/svg/**",
    "/layouts/wrappers/**",
    "/packaging/**",
    "/systemd/**",
    "/tray/**",
    "/docs/architecture.md",
    "/docs/release.md",
    "/docs/configuration.md",
    "/docs/gui.md",
    "/docs/troubleshooting.md",
    "/docs/profiling.md",
    "/docs/profiling-baselines.md",
    "/docs/assets/**",
    "/skills/designing-layouts/SKILL.md",
]

[workspace]
members = [".", "gui/src-tauri", "tray"]
default-members = ["."]

[[bin]]
name = "thermalwriter"
path = "src/main.rs"
required-features = ["daemon"]

[dependencies]
rusb = { version = "0.9", optional = true }
wait-timeout = "0.2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tiny-skia = "0.12"
taffy = "0.7"
tera = "1"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "gif", "png"] }
base64 = "0.22"
sysinfo = "0.33"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
serde = { version = "1", features = ["derive"] }
notify = "7"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
dirs = "6"
resvg = "0.47.0"

# Blitz HTML/CSS engine (optional — full CSS support via Stylo/Servo)
blitz-html = { version = "0.2", optional = true }
blitz-dom = { version = "0.2", optional = true, default-features = false }
blitz-paint = { version = "0.2", optional = true, default-features = false }
blitz-traits = { version = "0.2", optional = true, default-features = false }
anyrender = { version = "0.6", optional = true }
anyrender_vello_cpu = { version = "0.7", optional = true }
peniko = { version = "0.5", optional = true }
png = { version = "0.17", optional = true }
memmap2 = { version = "0.9.10", optional = true }
libc = "0.2"

# Heap allocation profiling (optional — see `dhat-heap` feature below)
dhat = { version = "0.3", optional = true }
material-colors = { version = "0.4.2", default-features = false, features = ["std"] }
nvml-wrapper = "0.12"

[features]
default = ["daemon"]
# The `daemon` feature gates all hardware-facing and daemon-specific code paths.
# Disable with `--no-default-features` to build the library for the GUI, which
# does not need libusb (rusb) or the xvfb mmap capture pipeline (memmap2).
daemon = ["dep:rusb", "dep:memmap2"]
blitz = ["dep:blitz-html", "dep:blitz-dom", "dep:blitz-paint", "dep:blitz-traits", "dep:anyrender", "dep:anyrender_vello_cpu", "dep:peniko", "dep:png"]
# Swaps in dhat's heap-profiling global allocator. Not part of `default` —
# only enabled for dedicated profiling builds (see docs/profiling.md).
dhat-heap = ["dep:dhat"]

[profile.profiling]
inherits = "release"
debug = true
strip = false

[[example]]
name = "preview_layout"
required-features = ["daemon"]
test = true

[[example]]
name = "preview_composite"
required-features = ["daemon"]
test = true

[[example]]
name = "preview_blitz"
required-features = ["blitz"]

[[example]]
name = "render_layout"
required-features = ["daemon"]

[[example]]
name = "send_test_frame"
required-features = ["daemon"]

[[example]]
name = "test_display"
required-features = ["daemon"]

[[example]]
name = "cpu_bench"
required-features = ["daemon"]

[[example]]
name = "memory_bench"
required-features = ["daemon"]

[dev-dependencies]
tempfile = "3"
serial_test = "3"
criterion = "0.5"

[[bench]]
name = "pipeline"
harness = false
required-features = ["daemon"]

[[bench]]
name = "render"
harness = false
