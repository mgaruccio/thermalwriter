#cloud-config
# thermalwriter release-QA guest defaults.
hostname: tw-qa
manage_etc_hosts: true
users:
  - name: qa
    gecos: thermalwriter QA
    groups: [sudo, adm]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - __SSH_PUBKEY__

package_update: true
packages:
  - qemu-guest-agent
  - curl
  - ca-certificates
  - tar
  - gzip
  - sudo
  - dbus
  - systemd
  - xvfb
  - libfuse2
  - fuse3
  - git
  - pkg-config
  - build-essential
  - libudev-dev

ssh_pwauth: false
disable_root: true

runcmd:
  - [ loginctl, enable-linger, qa ]
  - [ systemctl, enable, --now, qemu-guest-agent ]
  # Ensure user runtime dir scaffolding exists after linger.
  - [ mkdir, -p, /run/user/1000 ]
  - [ chown, qa:qa, /run/user/1000 ]
  - [ chmod, 700, /run/user/1000 ]

final_message: "thermalwriter QA cloud-init finished"
