name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev xvfb libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential curl wget file
      - name: Check formatting
        run: cargo fmt --check
      - name: Test workspace
        run: cargo test --workspace
      - name: Test library without daemon feature
        run: cargo test --workspace --no-default-features
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check dhat-heap profiling feature
        run: cargo check --features dhat-heap
      - name: Package daemon crate
        run: cargo package -p thermalwriter

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential curl wget file
      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci
      - name: Build frontend
        working-directory: gui
        run: npm run build
      - name: Build Tauri app
        working-directory: gui
        env:
          CI: false
          NO_STRIP: 1
        run: npm run tauri:build
